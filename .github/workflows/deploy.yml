
name: Build and publish Pocket Realms

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Install Godot export templates
        run: |
          mkdir -p /github/home/.local/share/godot/export_templates/4.3.stable
          cd /tmp
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          cp templates/* /github/home/.local/share/godot/export_templates/4.3.stable/

      - name: Export Web
        run: |
          mkdir -p web
          godot --headless --path . --export-release "Web" web/index.html
          test -f web/index.html
          touch web/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
